# Keep the Render free-tier deployment warm.
#
# Render's free web services spin down after ~15 minutes of inactivity and cold
# start on the next request (slow first hit). This workflow pings the /health
# endpoint every 12 minutes so the instance stays warm. GitHub Actions cron is
# not guaranteed to run exactly on schedule (it can be delayed a few minutes
# under load); if you ever see cold starts, tighten the interval to '*/10 * * * *'.
#
# To disable: comment out the `schedule:` block, or delete this file.
# To repoint at a new deployment URL: edit RENDER_URL below (or set a repo
# variable `RENDER_HEALTH_URL` and reference ${{ vars.RENDER_HEALTH_URL }}).

name: keep-alive

on:
  #schedule:
   # - cron: '*/12 * * * *'   # every 12 minutes
  workflow_dispatch:          # allow manual runs from the Actions tab

permissions:
  contents: read

env:
  RENDER_URL: https://prompt-injection-detector-ef86.onrender.com/health

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render /health
        run: |
          set -e
          echo "Pinging $RENDER_URL at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # --max-time 90s covers a cold start (Render free tier can take ~30-60s
          # to spin up); --fail makes curl exit non-zero on HTTP >= 400 so the
          # job is marked failed (and visible in the Actions tab) if the service
          # is down.
          for attempt in 1 2 3; do
            if curl --silent --show-error --fail --max-time 90 "$RENDER_URL" \
                    -o /tmp/health.json -w "HTTP %{http_code} in %{time_total}s\n"; then
              echo "--- /health body ---"
              cat /tmp/health.json
              echo
              exit 0
            fi
            echo "attempt $attempt failed; retrying in 20s..."
            sleep 20
          done
          echo "::warning::Render /health did not respond after 3 attempts."
          exit 1
